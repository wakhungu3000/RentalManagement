<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Rental Property Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- th:href is used inside Spring Boot; plain href is used when opened directly in a browser -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="css/style.css">
</head>
<body>

<div class="login-shell">

    <!-- Left panel: decorative blueprint graphic, no backend data -->
    <div class="login-blueprint">
        <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="600" height="800" fill="#211B17"/>
            <g stroke="#3A322B" stroke-width="1" fill="none">
                <path d="M80 620 L80 300 L300 180 L520 300 L520 620 Z"/>
                <line x1="80" y1="450" x2="520" y2="450"/>
                <line x1="220" y1="620" x2="220" y2="450"/>
                <line x1="380" y1="620" x2="380" y2="450"/>
                <rect x="140" y="500" width="70" height="90"/>
                <rect x="260" y="500" width="70" height="90"/>
                <rect x="380" y="500" width="70" height="90"/>
                <rect x="150" y="330" width="50" height="60"/>
                <rect x="400" y="330" width="50" height="60"/>
            </g>
            <g stroke="#A8431F" stroke-width="1.5" fill="none" opacity="0.6">
                <circle cx="300" cy="180" r="4" fill="#A8431F" stroke="none"/>
                <line x1="300" y1="180" x2="300" y2="140"/>
                <line x1="280" y1="150" x2="320" y2="150"/>
            </g>
        </svg>
        <p class="caption">Every house, every tenant, every payment — in one ledger.</p>
    </div>

    <!-- Right panel: login form -->
    <div class="login-form-side">
        <div class="login-box">
            <span class="wordmark">Nyumba Ledger</span>
            <p class="tagline">Rental Property Management System</p>

            <!-- Backend error: shown when the controller passes loginError=true -->
            <div class="form-error" th:if="${loginError}">
                Incorrect username or password. Please try again.
            </div>

            <!-- Filled in by js/login.js when the server refuses the login -->
            <div class="form-error" id="loginError" hidden></div>

            <!-- DEVELOPMENT ONLY: delete this box before real use (see README) -->
            <div class="demo-hint">
                <strong>Sample accounts</strong><br>
                Owner: <code>owner01</code> / <code>admin123</code><br>
                Tenant: <code>tenant01</code> / <code>tenant123</code><br>
                Tenants the owner adds get their own login details.
            </div>

            <form id="loginForm" th:action="@{/login}" method="post" action="#">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. owner01" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">Log in</button>
                    <button type="reset" class="btn btn-ghost">Clear</button>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="js/login.js"></script>
</body>
</html>
