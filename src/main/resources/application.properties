spring.application.name=nyumba-ledger
server.port=8080

# ---- DATABASE: MySQL ---------------------------------------------------------
# Secrets do NOT go in this file. Put your own values in a file called
# local.properties next to pom.xml (copy local.properties.example). It is read
# automatically if it exists and overrides anything below.
spring.config.import=optional:file:./local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/nyumba?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=nyumba_app
spring.datasource.password=zakayo

# The tables come from database/schema.sql. "validate" makes the app refuse to start
# if the database does not match the Java classes, instead of silently changing it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Accounts ----------------------------------------------------------------
# The owner account is created once, the first time the app starts on an empty database.
app.owner.username=owner01
app.owner.password=admin123
app.owner.name=Property Owner

# true = load the sample houses/tenants/invoices (only if the database has no houses yet).
# Keep false for a real system.
app.seed-demo-data=true

# ---- Sessions ----------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# server.servlet.session.cookie.secure=true   # turn on when the site runs on HTTPS

#---
# PRODUCTION: only active when SPRING_PROFILES_ACTIVE=prod
spring.config.activate.on-profile=prod

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.owner.username=owner01
app.owner.password=${OWNER_PASSWORD}
app.owner.reset-password=false
app.seed-demo-data=false

spring.jpa.show-sql=false

server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

