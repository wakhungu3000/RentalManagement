<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports — Rental Property Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="css/style.css">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar: identical on every owner page. Later move into
         fragments/sidebar.html and include it with th:replace. -->
    <aside class="sidebar">
        <span class="wordmark">Nyumba Ledger</span>
        <nav>
            <a th:href="@{/dashboard}" href="admin-dashboard.html">Dashboard</a>
            <a th:href="@{/houses}" href="houses.html">House Management</a>
            <a th:href="@{/tenants}" href="tenants.html">Tenant Management</a>
            <a th:href="@{/payments}" href="payments.html">Rent Payments</a>
            <a th:href="@{/maintenance}" href="maintenance.html">Maintenance Requests</a>
            <a th:href="@{/reports}" href="reports.html" class="active">Reports</a>
        </nav>
        <div class="logout">
            <a th:href="@{/logout}" href="login.html" id="logoutLink">Log out</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Reports</h1>
                <p class="subtitle">Choose a report, then print it or export it for a spreadsheet.</p>
            </div>
            <div class="page-actions"><button class="btn btn-ghost" id="csvBtn" type="button">Export CSV</button> <button class="btn btn-primary" id="printBtn" type="button">Print report</button></div>
        </div>
        <div class="toolbar">
            <div class="tabs" role="tablist">
                <button type="button" class="active" data-tab="houses">Houses</button>
                <button type="button" data-tab="tenants">Tenants</button>
                <button type="button" data-tab="payments">Payments</button>
                <button type="button" data-tab="maintenance">Maintenance</button>
            </div>
        </div>
        <h2 class="section-title first" id="reportTitle">House report</h2>
        <p class="subtitle report-date" id="reportDate"></p>
        <div class="stat-row stat-row-auto" id="summary"></div>
        <div class="table-scroll">
            <table class="ledger">
                <thead id="reportHead"></thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>
        <p class="empty-note" id="reportEmpty" hidden>Nothing to report yet.</p>
    </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="confirmDialog" class="modal modal-sm">
    <div class="modal-body">
        <h2 id="confirmTitle">Are you sure?</h2>
        <p id="confirmText" class="modal-text"></p>
        <div class="btn-row">
            <button class="btn btn-danger" id="confirmOk" type="button">Confirm</button>
            <button class="btn btn-ghost" id="confirmCancel" type="button">Cancel</button>
        </div>
    </div>
</dialog>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/owner-reports.js"></script>
</body>
</html>
